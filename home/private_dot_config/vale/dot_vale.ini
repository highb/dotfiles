# User-level Vale configuration. Vale reads this file under whatever
# configuration a run already found, so what belongs here is what should hold
# everywhere: the styles to download, the vocabulary, and a spell check.
#
# `vale ls-config` prints the result of that layering for any directory, and
# `vale --no-global` leaves this file out of a run entirely.
#
# Two things about layering are worth knowing before editing this file:
#
#   - List keys join across files. A style named here is added to every
#     project's `BasedOnStyles`, and a project cannot remove it. That is why
#     `[*]` names only `Vale`, the built-in spell check, and why the opinionated
#     styles live in contexts/ instead.
#   - Single-value keys are won by the file read last, so a project's own
#     `MinAlertLevel` overrides the one below.
#
# StylesPath is deliberately unset: Vale's default is ~/.local/share/vale/styles
# on both Linux and macOS, which keeps downloaded styles out of this directory.

MinAlertLevel = suggestion

# `vale sync` installs these. It reads exactly one configuration file, so it
# has to be pointed at this one: `vale sync --config ~/.config/vale/.vale.ini`.
# run_onchange_after_25-vale-sync.sh does that.
Packages = AiTells, Harper, Joblint, Readability, Std, alex, neighbor, proselint, write-good

# Inventory is rendered from packages.yaml; Local is hand-maintained. Both
# live under the StylesPath, and both must exist or a run stops with an error,
# so chezmoi deploys them alongside this file. Employer terminology belongs in
# a machine-local Work vocabulary; see Local/accept.txt for how.
Vocab = Inventory, Local

[*]
# The built-in style: Vale.Spelling, Vale.Terms, Vale.Avoid, Vale.Repetition.
# Harper adds itself here too, from the .vale-config/ it ships inside the
# StylesPath, so its grammar rules run whether or not a context asks for them.
BasedOnStyles = Vale
