# Job posts and hiring copy. This is the context Joblint exists for: it reads
# a tech job post for sexism, culture-fit signalling, and recruiter language.
#
# Read on top of ~/.config/vale/.vale.ini. Select it with `vale-as jobs`.
#
# Suggestion level, and no rules switched off. A job post is short, published,
# and read by people deciding whether to apply, so the noise is worth reading.
MinAlertLevel = suggestion

[*.{md,markdown,txt,html}]
BasedOnStyles = Vale, Joblint, Std, alex, neighbor

Std.Readability.SentenceLength[max] = 28

# Grade 10: a job post should not need a technical reader.
Readability.FleschKincaid = YES
Readability.FleschKincaid[condition] = > 10
