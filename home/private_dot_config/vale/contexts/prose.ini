# Fiction and creative prose.
#
# Read on top of ~/.config/vale/.vale.ini. Select it with `vale-as prose`.
#
# Std, write-good, alex and neighbor are left out rather than switched off rule
# by rule. Everything they check is a choice in fiction: the passive voice, the
# adverb, the sentence that runs long on purpose, the first person, and the
# ugly word a character is supposed to say. A linter that reports those is
# reporting the writing.
#
# What is left is spelling, grammar, the proselint rules that come from style
# guides rather than style preferences, and the AI tells worth knowing about.
MinAlertLevel = warning

[*.{md,markdown,txt,org}]
BasedOnStyles = Vale, proselint, AiTells

# The em-dash, the adverb and the passive are tools here, not tells.
AiTells.Dash = NO
AiTells.Adverb = NO
AiTells.Passive = NO

# AiTells rules about documentation shape, which fiction does not have.
AiTells.CodeToken = NO
AiTells.FilePath = NO
AiTells.LinkText = NO
AiTells.SectionCode = NO
AiTells.StatusBracket = NO

# Characters curse, exaggerate, and speak in clichés on purpose.
proselint.Cursing = NO
proselint.Hyperbole = NO
Harper.AvoidCurses = NO

# A draft is allowed to carry its own notes.
proselint.Annotations = suggestion

# The vocabulary is a list of command-line tools. It has nothing to say about
# a character's name, and Vale.Terms would enforce the casing of both.
Vale.Terms = NO
