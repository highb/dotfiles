# Blogging: posts, essays, anything with a public byline.
#
# Read on top of ~/.config/vale/.vale.ini. Select it with `vale-as blog`.
#
# Suggestion level, unlike work: a post gets a polishing pass, and the
# stylistic rules are the reason to run the linter at all.
MinAlertLevel = suggestion

[*.{md,mdx,markdown,txt,rst,adoc,org,html}]
BasedOnStyles = Vale, Std, alex, neighbor, proselint, write-good, AiTells

# A post that reads aloud uses contractions and the first person.
Std.Grammar.Contractions = NO
Std.Usage.FirstPersonPlural = NO
Std.Usage.FirstPersonSingular = NO
Std.Readability.SentenceLength[max] = 28

# One passive rule and one cliché rule of the three each, as in work.ini.
# Published prose keeps write-good's passive rule at its own level.
Std.Grammar.PassiveVoice = NO
AiTells.Passive = NO
write-good.Cliches = NO
AiTells.Cliche = NO

# Acronyms are still acronyms, but a post has more room to spell one out.
alex.ProfanityUnlikely = NO
neighbor.AllCapsProse = suggestion

# See work.ini: the em-dash rule fires on prose written by hand.
AiTells.Dash = NO

# Grade 12: a general reader who chose to read this.
Readability.FleschKincaid = YES
Readability.FleschKincaid[condition] = > 12
