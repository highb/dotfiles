# Technical documentation: design docs, RFCs, runbooks, READMEs, tickets.
#
# Read on top of ~/.config/vale/.vale.ini. Select it with `vale-as docs`, or
# VALE_CONFIG_PATH, or --config.
#
# This file is published with the rest of these dotfiles, so it holds writing
# preferences and nothing else. A context that needs an employer's terminology,
# document names, or house rules belongs in a sibling `*.local.ini`, which
# .chezmoiignore keeps out of the repository: copy this file to
# ~/.config/vale/contexts/work.local.ini and edit from there. `vale-as work`
# then finds it, because a local file wins over a published one of the
# same name.
#
# Warning, not suggestion: a working document is being written, not polished,
# and the suggestion level is where the stylistic opinions live. Lower it with
# --minAlertLevel=suggestion for a final pass.
MinAlertLevel = warning

[*.{md,mdx,markdown,txt,rst,adoc,org}]
BasedOnStyles = Vale, Std, alex, neighbor, proselint, write-good, AiTells

# Team writing says "we", says "I", and uses contractions.
Std.Grammar.Contractions = NO
Std.Usage.FirstPersonPlural = NO
Std.Usage.FirstPersonSingular = NO
Std.Readability.SentenceLength[max] = 32

# Three of the installed styles check passive voice and three check clichés.
# Left alone that is the same sentence reported three times, so one of each
# runs and the others are off. write-good's passive rule is the specific one;
# it stays advisory here because a specification is often passive on purpose.
Std.Grammar.PassiveVoice = NO
AiTells.Passive = NO
write-good.Passive = suggestion
write-good.Cliches = NO
AiTells.Cliche = NO

# Measured against this repository's own documentation, these fire only on
# false positives in technical prose:
#   alex.ProfanityUnlikely      "hook", as in a git hook
#   alex.Ablist                 "disabled", said of a flag rather than a person
#   neighbor.AllCapsProse       TOML, GNOME, and every other acronym
#   Harper.ExpandConfiguration  "config", which is a file name and a key name
alex.ProfanityUnlikely = NO
alex.ProfanityMaybe = NO
alex.Ablist = suggestion
neighbor.AllCapsProse = NO
Harper.ExpandConfiguration = NO

# A TODO in a working document is the point of the working document.
proselint.Annotations = suggestion

# The em-dash is a habit here rather than a tell, and it is the single noisiest
# rule in the AiTells style on prose that was written by hand.
AiTells.Dash = NO

# One readability metric, not the seven the Readability style installs. The
# rule is switched on by name, so the rest are never loaded. Grade 14 is a
# technical reader; `Readability.FleschKincaid[condition] = > 12` is stricter.
Readability.FleschKincaid = YES
Readability.FleschKincaid[condition] = > 14
