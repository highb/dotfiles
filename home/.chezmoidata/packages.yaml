# Machine inventory: everything a working machine needs that is not a dotfile.
#
# Single logical source of truth. Each tool is declared once, with the name it
# goes by in each package manager underneath. chezmoi resolves this per machine
# and renders metapac group files from it; metapac does the installing.
#
#   packages.yaml  ->  chezmoi template  ->  ~/.config/metapac/  ->  metapac sync
#   (this file)        (resolution)          (generated)            (execution)
#
# Edit tool definitions and task groups here. Select groups per machine with
# data.machine.packageGroups in the local chezmoi config, not in this file.
# ~/.config/metapac/ is generated output, overwritten by `chezmoi apply`.
#
# Backend ids are metapac's own, which is why the Arch backend is `arch` and not
# `pacman`. See https://github.com/ripytide/metapac.
#
# Extracted 2026-08-30 from highb/.bhell.
#
# Entries are never silently deleted. A tool that is no longer wanted keeps its
# entry and gains a `status`, so the record of what was once installed and why
# it stopped being installed lives here rather than in a commit nobody reads.

packages:
  meta:
    schema: 2
    extracted_from: highb/.bhell
    extracted_on: 2026-08-30
    executor: metapac

  # Task groups are additive; a shared tool is requested only once. Include
  # required runtimes explicitly (for example, writing includes node for npm).
  # Omitted machine.packageGroups preserves the full inventory; [] selects none.
  # packageExcludes wins over membership. No group is implicitly required.
  groups:
    core: [age, chezmoi, curl, file, git, jq, magic-wormhole, metapac, procps, pwgen, ripgrep, yq]
    shell: [atuin, bat, direnv, eza, fd, fzf, navi, starship, zoxide]
    development: [build-essential, direnv, exercism, gh, git, httpie, kickstart, node, ruby, rust, vim, xh]
    cloud: [awscli, google-cloud-cli]
    kubernetes: [helm, k3d, kubectl, kubie, kustomize]
    writing: [hugo, markdownlint-cli, node, prettier, zola]
    desktop: [1password, code, discord, ghostty, slack]
    ai: [oh-my-pi]

  # Which backend wins, most preferred first. This is the layer metapac does
  # not have: it treats every enabled backend independently, so without this a
  # tool listed under both apt and brew gets installed twice.
  #
  # The first backend in the list that (a) is in this platform's list and
  # (b) has an entry for the tool wins. A tool's `prefer` is tried ahead of it.
  #
  # Rationale: mise first - cross-platform, unprivileged, and one of the few
  # backends metapac can actually pin a version through. Then nix, brew, cargo
  # and uv, which are all user-scoped and carry current versions. The OS package
  # manager is deliberately late: for fast-moving CLI tools it ships whatever
  # the distro froze, and it is the hardest to pin. snap and flatpak last.
  #
  # nix is listed but probed before use - see backend_probe below.
  provider_priority:
    default:      [mise, nix, brew, cargo, uv, apt, dnf, arch, snap, flatpak]
    linux-ubuntu: [mise, nix, brew, cargo, uv, apt, snap, flatpak]
    linux-debian: [mise, nix, brew, cargo, uv, apt, flatpak]
    linux-arch:   [mise, nix, brew, cargo, uv, arch, flatpak]
    linux-fedora: [mise, nix, brew, cargo, uv, dnf, flatpak]
    darwin:       [mise, nix, brew, cargo, uv, mas]

  # How to tell whether a backend actually exists on this machine. Resolution
  # skips a backend whose binary is absent, so a tool falls through to the next
  # one in the priority list rather than being assigned to a package manager
  # that is not installed. metapac has no equivalent: its enabled_backends is
  # static, so it would happily be told to install a brew package on a machine
  # with no brew.
  # A backend whose binary exists but which cannot actually be queried is
  # worse than one that is absent: metapac aborts the entire run when any one
  # backend errors. Anything with a probe here must run cleanly or it is
  # dropped from resolution on this machine.
  #
  # nix has one because metapac 0.10.1 calls
  # `nix profile list --json --no-pretty`. That flag is absent from nix 2.26.2
  # and documented by 2.28, so it landed in 2.27 or 2.28 - upgrading to 2.26
  # is NOT enough. On a nix without it the probe fails and nix is skipped; on
  # one with it the probe passes and nix takes its place second.
  # See KNOWN_ISSUES.md.
  backend_probe:
    nix: nix profile list --json --no-pretty

  backend_binaries:
    apt: apt-get
    arch: pacman
    brew: brew
    cargo: cargo
    dnf: dnf
    flatpak: flatpak
    mas: mas
    mise: mise
    nix: nix
    pipx: pipx
    snap: snap
    uv: uv

  # `mise-direct` means the tool lives in ~/.config/mise/config.toml by hand,
  # because metapac's mise backend cannot express its name. Templates skip it.
  # Only `active` tools are installed. superseded / unmaintained / retired are
  # kept for the record and reported by `metapac unmanaged` if still present.
  tools:
    1password:
      status: active
      note: "also the ssh commit signer: .gitconfig points at /opt/1Password/op-ssh-sign"
      providers:
        snap: { name: 1password }

    age:
      status: active
      providers:
        mise: { name: age }
        apt: { name: age }
        brew: { name: age }

    asdf:
      status: superseded
      superseded_by: mise
      note: "mise reads .tool-versions and is what this machine uses now"
      providers:
        brew: { name: asdf }

    atuin:
      status: active
      note: "referenced by shell.yaml, never installed here"
      providers:
        mise: { name: atuin }
        brew: { name: atuin }

    awscli:
      status: active
      prefer: [mise]
      providers:
        brew: { name: awscli }
        mise: { name: awscli }
        snap: { name: aws-cli, options: { confinement: classic } }

    bat:
      status: active
      note: "apt installs the binary as batcat on Debian and Ubuntu"
      providers:
        mise: { name: bat }
        apt: { name: bat, binary: batcat }
        brew: { name: bat }

    build-essential:
      status: active
      providers:
        apt: { name: build-essential }
        arch: { name: base-devel }

    chezmoi:
      status: active
      note: "the dotfile manager itself, installed by the thing it configures"
      providers:
        mise: { name: chezmoi }
        brew: { name: chezmoi }

    code:
      status: active
      providers:
        snap: { name: code }

    curl:
      status: active
      providers:
        apt: { name: curl }
        arch: { name: curl }
        brew: { name: curl }

    direnv:
      status: active
      prefer: [mise]
      providers:
        apt: { name: direnv }
        brew: { name: direnv }
        mise: { name: direnv }

    discord:
      status: active
      providers:
        snap: { name: discord }

    exa:
      status: unmaintained
      superseded_by: eza
      note: "archived upstream in 2023"
      providers:
        brew: { name: exa }

    exercism:
      status: active
      providers:
        brew: { name: exercism }
        snap: { name: exercism }

    eza:
      status: active
      note: "the maintained fork of exa"
      providers:
        mise: { name: eza }
        apt: { name: eza }
        brew: { name: eza }

    fd:
      status: active
      note: "apt installs the binary as fdfind on Debian and Ubuntu"
      providers:
        mise: { name: fd }
        apt: { name: fd-find, binary: fdfind }
        brew: { name: fd }

    file:
      status: active
      providers:
        apt: { name: file }
        arch: { name: file }
        brew: { name: file }

    fzf:
      status: active
      prefer: [mise]
      providers:
        apt: { name: fzf }
        brew: { name: fzf }
        mise: { name: fzf }

    gh:
      status: active
      providers:
        mise: { name: gh }
        apt: { name: gh }
        brew: { name: gh }

    ghostty:
      status: active
      note: "config is managed: home/private_dot_config/ghostty/config"
      providers:
        snap: { name: ghostty }

    git:
      status: active
      providers:
        apt: { name: git }
        arch: { name: git }
        brew: { name: git }

    google-cloud-cli:
      status: active
      note: "installed by curl-to-bash on darwin in .bhell"
      providers:
        snap: { name: google-cloud-cli, binary: gcloud, options: { confinement: classic } }

    helm:
      status: active
      prefer: [mise]
      providers:
        brew: { name: helm }
        mise: { name: helm }

    httpie:
      status: active
      note: "overlaps xh, which mise already installs and which is the faster reimplementation"
      providers:
        apt: { name: httpie }
        brew: { name: httpie }

    hugo:
      status: active
      prefer: [mise]
      providers:
        mise: { name: hugo, options: { version: 0.155.1 } }

    jq:
      status: active
      providers:
        mise: { name: jq }
        apt: { name: jq }
        brew: { name: jq }

    k3d:
      status: active
      prefer: [mise]
      providers:
        brew: { name: k3d }
        mise: { name: k3d }

    kickstart:
      status: active
      note: "project scaffolding, Tera-templated - the same engine mise uses"
      providers:
        cargo: { name: kickstart, options: { features: [cli], locked: true } }

    metapac:
      status: active
      note: >
        installs everything else here. cargo-only and therefore the one thing
        keeping rust on the bootstrap critical path: upstream publishes no
        release binaries, so mise cannot fetch it and neither can binstall.
        See KNOWN_ISSUES.md.
      providers:
        cargo: { name: metapac, options: { locked: true } }

    kubectl:
      status: active
      prefer: [mise]
      note: "listed as kubernetes-cli in .bhell"
      providers:
        brew: { name: kubernetes-cli }
        mise: { name: kubectl }

    kubie:
      status: active
      prefer: [mise]
      providers:
        brew: { name: kubie }
        mise: { name: kubie }

    kustomize:
      status: active
      providers:
        mise: { name: kustomize }
        brew: { name: kustomize }

    magic-wormhole:
      status: active
      providers:
        apt: { name: magic-wormhole, binary: wormhole }
        brew: { name: magic-wormhole }

    markdownlint-cli:
      status: mise-direct
      note: >
        metapac's mise backend validates names against `mise search`, which lists
        only registry tools - a `npm:` or `github:` name fails validation and
        aborts the whole run, every backend with it. So this one is declared
        directly in ~/.config/mise/config.toml and metapac never sees it.
        `metapac unmanaged` will report it; that is correct, not a defect.
      providers:
        mise: { name: "npm:markdownlint-cli", binary: markdownlint }

    minikube:
      status: retired
      superseded_by: k3d
      providers:
        brew: { name: minikube }

    navi:
      status: active
      providers:
        mise: { name: navi }
        brew: { name: navi }

    node:
      status: active
      note: "runtime, and what mise's npm: backend installs into"
      providers:
        mise: { name: node }

    oh-my-pi:
      status: mise-direct
      note: >
        metapac's mise backend validates names against `mise search`, which lists
        only registry tools - a `npm:` or `github:` name fails validation and
        aborts the whole run, every backend with it. So this one is declared
        directly in ~/.config/mise/config.toml and metapac never sees it.
        `metapac unmanaged` will report it; that is correct, not a defect.
      providers:
        mise: { name: "github:can1357/oh-my-pi", binary: omp }

    oh-my-zsh:
      status: retired
      note: "still on disk at ~/.oh-my-zsh, sourced by nothing"
      providers: {}

    procps:
      status: active
      providers:
        apt: { name: procps, binary: ps }
        arch: { name: procps-ng }

    prettier:
      status: mise-direct
      note: >
        metapac's mise backend validates names against `mise search`, which lists
        only registry tools - a `npm:` or `github:` name fails validation and
        aborts the whole run, every backend with it. So this one is declared
        directly in ~/.config/mise/config.toml and metapac never sees it.
        `metapac unmanaged` will report it; that is correct, not a defect.
      providers:
        mise: { name: "npm:prettier" }

    pwgen:
      status: active
      providers:
        apt: { name: pwgen }
        brew: { name: pwgen }

    ripgrep:
      status: active
      prefer: [mise]
      providers:
        apt: { name: ripgrep, binary: rg }
        brew: { name: ripgrep }
        mise: { name: ripgrep, binary: rg }
        snap: { name: ripgrep, options: { confinement: classic } }

    ruby:
      status: active
      providers:
        mise: { name: ruby }

    rust:
      status: active
      note: "mise's rust plugin wraps rustup; the cargo backend needs the cargo it provides"
      providers:
        mise: { name: rust, binary: rustc }

    skaffold:
      status: retired
      note: "from a job that used it; nothing here does now"
      providers:
        brew: { name: skaffold }

    slack:
      status: active
      providers:
        snap: { name: slack }

    starship:
      status: active
      note: "installed to /usr/local/bin by the upstream install script; not owned by any package manager on this machine"
      providers:
        mise: { name: starship }
        brew: { name: starship }
        snap: { name: starship }

    vim:
      status: active
      providers:
        apt: { name: vim }
        arch: { name: vim }
        brew: { name: vim }

    xh:
      status: active
      prefer: [mise]
      providers:
        brew: { name: xh }
        mise: { name: xh }

    yq:
      status: active
      providers:
        mise: { name: yq }
        brew: { name: yq }

    zola:
      status: active
      providers:
        mise: { name: zola }
        brew: { name: zola }
        snap: { name: zola }

    zoxide:
      status: active
      providers:
        mise: { name: zoxide }
        apt: { name: zoxide }
        brew: { name: zoxide }

    zplug:
      status: retired
      note: "zsh plugin manager; .zshrc has been framework-free since 851d536"
      providers: {}
  fonts:
    - name: Source Code Pro
      upstream: https://github.com/adobe-fonts/source-code-pro
      license: OFL-1.1
      install: { linux: "~/.local/share/fonts", darwin: "brew --cask font-source-code-pro" }
      status: active
      note: >
        .bhell installed to ~/.fonts, the legacy path; ~/.local/share/fonts is
        the XDG location fontconfig prefers. metapac has no font backend, so
        this is still unhandled - see the gaps list in .bhell/TODO.md.
    - name: Nerd Font patched variant
      status: todo
      note: >
        Needed by starship's default preset and the powerline glyphs the old
        zsh config assumed. On macOS this is a brew cask; on Linux it is a
        download, which is the gap.

  # Upstream installer scripts. metapac has no backend for these.
  bootstrap:
    - { name: mise, method: curl-to-bash, url: "https://mise.run", status: active,
        note: "the one bootstrap that still matters; everything else comes from it" }
    - { name: metapac, method: cargo, status: active,
        note: "cargo install metapac --locked; chicken-and-egg with the cargo backend" }
    - { name: homebrew, method: curl-to-bash, status: retired,
        note: "linuxbrew was installed under sudo, which homebrew warns against" }
    - { name: oh-my-zsh, method: curl-to-bash, status: retired }
    - { name: zplug, method: curl-to-bash, status: retired }
    - { name: amix/vimrc, method: git-clone, status: retired, superseded_by: "home/private_dot_config/nvim" }
    - { name: gpakosz/.tmux, method: git-clone, status: active,
        note: "not currently managed here" }

  # Both tap files in .bhell were corrupt - one held the literal string `nnn`,
  # the other `homebrew/cask-fontsnnn` - so the tap loop had been failing or
  # tapping nothing for years. metapac supports these as `repos` per backend
  # when something actually needs one.
  repos: {}
