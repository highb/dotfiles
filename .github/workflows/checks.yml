name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Shell checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Supply Ubuntu zsh prerequisite
        if: runner.os == 'Linux'
        run: |
          if ! command -v zsh >/dev/null 2>&1; then
            env -i PATH="$PATH" HOME="$HOME" sudo apt-get update
            env -i PATH="$PATH" HOME="$HOME" sudo apt-get install --no-install-recommends -y zsh
          fi

      - name: Require native shells
        run: |
          test -x /bin/bash || { echo 'Required shell /bin/bash is missing' >&2; exit 1; }
          test -x /bin/zsh || { echo 'Required shell /bin/zsh is missing' >&2; exit 1; }
          env -i PATH="$PATH" HOME="$HOME" /bin/bash --version
          env -i PATH="$PATH" HOME="$HOME" /bin/zsh --version

      - name: Install pinned check tools
        run: |
          env -i PATH="$PATH" HOME="$HOME" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            python3 -m pip --isolated install --disable-pip-version-check --no-input 'pre-commit==4.6.2'
          env -i PATH="$PATH" HOME="$HOME" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            RUNNER_TEMP="$RUNNER_TEMP" GITHUB_PATH="$GITHUB_PATH" \
            python3 -B scripts/setup_ci_tools.py

      - name: Scan tracked files before tests
        run: |
          env -i PATH="$PATH" HOME="$HOME" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            pre-commit run --all-files

      - name: Run isolated shell checks
        run: |
          env -i PATH="$PATH" HOME="$HOME" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            python3 -B -m unittest discover -s tests -v
