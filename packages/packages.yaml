# Machine inventory: everything a working machine needs that is not a dotfile.
#
# Extracted 2026-08-30 from highb/.bhell, which installed this set with a
# handful of bash scripts and one flat list per platform per package manager.
#
# Nothing consumes this file yet. It is the input format for the provisioning
# tool described in ../docs/provisioning-gap.md, kept declarative so that the
# tool can be written against data that already exists rather than the data
# being invented to fit the tool.
#
# Entries are never silently deleted. A tool that is no longer wanted keeps its
# entry and gains a `status`, so the record of what was once installed and why
# it stopped being installed lives here rather than in a commit nobody reads.

meta:
  extracted_from: highb/.bhell
  extracted_on: 2026-08-30
  consumed_by: nothing yet

# `provider` says who owns installing a tool, and is the field that matters
# most. This machine currently has four overlapping package sources - mise,
# apt/snap, nix, and curl-to-bash installers - and tools installed by more than
# one of them is the single biggest source of confusion. See the gap doc.
#
#   mise    declared in home/dot_config/mise/config.toml, already working
#   system  the platform package manager: apt, brew, snap, pacman
#   manual  an upstream installer script or a release download
#
# status:
#   active       wanted, current
#   superseded   replaced by something else, see superseded_by
#   unmaintained upstream is dead
#   retired      deliberately dropped, kept for the record

tools:

  # --- Base system ---------------------------------------------------------
  build-essential:  { provider: system, apt: build-essential, pacman: base-devel, brew: null, status: active }
  curl:             { provider: system, apt: curl, brew: curl, pacman: curl, status: active }
  file:             { provider: system, apt: file, brew: file, pacman: file, status: active }
  git:              { provider: system, apt: git, brew: git, pacman: git, status: active }
  procps:           { provider: system, apt: procps, pacman: procps-ng, status: active }
  vim:              { provider: system, apt: vim, brew: vim, pacman: vim, status: active }

  # --- Shell tooling that .config/shell assumes ----------------------------
  # shell.yaml activates each of these if present and skips it if not, so a
  # missing one degrades quietly rather than breaking a terminal. That is also
  # why their absence has gone unnoticed: several are not installed here.
  fzf:              { provider: mise, apt: fzf, brew: fzf, status: active }
  direnv:           { provider: mise, apt: direnv, brew: direnv, status: active }
  ripgrep:          { provider: mise, apt: ripgrep, brew: ripgrep, snap: "ripgrep --classic", status: active }
  starship:         { provider: manual, brew: starship, snap: starship, status: active,
                      note: "installed to /usr/local/bin by the upstream install script; not owned by any package manager on this machine" }
  bat:              { provider: system, apt: bat, brew: bat, status: active,
                      note: "apt installs the binary as batcat on Debian and Ubuntu" }
  fd:               { provider: system, apt: fd-find, brew: fd, status: active,
                      note: "apt installs the binary as fdfind on Debian and Ubuntu" }
  zoxide:           { provider: system, apt: zoxide, brew: zoxide, status: active }
  atuin:            { provider: manual, brew: atuin, status: active,
                      note: "referenced by shell.yaml, never installed here" }
  eza:              { provider: system, apt: eza, brew: eza, status: active,
                      note: "the maintained fork of exa" }

  # --- Development ---------------------------------------------------------
  gh:               { provider: system, apt: gh, brew: gh, status: active }
  jq:               { provider: system, apt: jq, brew: jq, status: active }
  yq:               { provider: system, brew: yq, status: active }
  age:              { provider: system, apt: age, brew: age, status: active }
  httpie:           { provider: system, apt: httpie, brew: httpie, status: active,
                      note: "overlaps xh, which mise already installs and which is the faster reimplementation" }
  xh:               { provider: mise, brew: xh, status: active }
  navi:             { provider: system, brew: navi, status: active }
  pwgen:            { provider: system, apt: pwgen, brew: pwgen, status: active }
  magic-wormhole:   { provider: system, apt: magic-wormhole, brew: magic-wormhole, status: active }
  zola:             { provider: system, snap: zola, brew: zola, status: active }
  hugo:             { provider: mise, status: active }

  # --- Kubernetes and cloud ------------------------------------------------
  kubectl:          { provider: mise, brew: kubernetes-cli, status: active,
                      note: "listed as kubernetes-cli in .bhell" }
  kubie:            { provider: mise, brew: kubie, status: active }
  helm:             { provider: mise, brew: helm, status: active }
  k3d:              { provider: mise, brew: k3d, status: active }
  awscli:           { provider: mise, brew: awscli, snap: "aws-cli --classic", status: active }
  google-cloud-cli: { provider: system, snap: "google-cloud-cli --classic", status: active,
                      note: "installed by curl-to-bash on darwin in .bhell" }
  kustomize:        { provider: system, brew: kustomize, status: active }
  minikube:         { provider: system, brew: minikube, status: retired,
                      superseded_by: k3d }
  skaffold:         { provider: system, brew: skaffold, status: retired,
                      note: "from a job that used it; nothing here does now" }

  # --- Desktop applications ------------------------------------------------
  # GUI applications, separated because a headless or server machine wants the
  # list above and none of this one.
  1password:        { provider: system, snap: 1password, status: active,
                      note: "also the ssh commit signer: .gitconfig points at /opt/1Password/op-ssh-sign" }
  code:             { provider: system, snap: code, status: active }
  slack:            { provider: system, snap: slack, status: active }
  discord:          { provider: system, snap: discord, status: active }
  exercism:         { provider: system, snap: exercism, brew: exercism, status: active }
  ghostty:          { provider: system, snap: ghostty, status: active,
                      note: "config is managed: home/dot_config/ghostty/config" }

  # --- Superseded ----------------------------------------------------------
  exa:              { provider: system, brew: exa, status: unmaintained,
                      superseded_by: eza,
                      note: "archived upstream in 2023" }
  asdf:             { provider: system, brew: asdf, status: superseded,
                      superseded_by: mise,
                      note: "mise reads .tool-versions and is what this machine uses now" }
  zplug:            { provider: manual, status: retired,
                      note: "zsh plugin manager; .zshrc has been framework-free since 851d536" }
  oh-my-zsh:        { provider: manual, status: retired,
                      note: "still on disk at ~/.oh-my-zsh, sourced by nothing" }

fonts:
  # .bhell vendored 16 TTFs and copied them into ~/.fonts. Declared here
  # instead: a provisioning tool should fetch a pinned release, not carry
  # 1.9MB of binaries in a config repo.
  - name: Source Code Pro
    upstream: https://github.com/adobe-fonts/source-code-pro
    license: OFL-1.1
    install: { linux: "~/.local/share/fonts", darwin: "brew --cask font-source-code-pro" }
    status: active
    note: >
      .bhell installed to ~/.fonts, which is the legacy path; ~/.local/share/fonts
      is the XDG location and is what fontconfig prefers now.
  - name: Nerd Font patched variant
    status: todo
    note: >
      Not in .bhell, but starship's default preset and the powerline glyphs the
      old zsh config assumed both need one. Worth resolving when the tool exists.

bootstrap:
  # Upstream installer scripts. Each is an unpinned curl-to-bash or a git clone
  # that .bhell re-ran on every setup, which is why setup was not idempotent in
  # any useful sense.
  - name: homebrew
    method: curl-to-bash
    url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
    platforms: [darwin, linux]
    status: retired
    note: "linuxbrew was installed under sudo, which homebrew explicitly warns against"
  - name: oh-my-zsh
    method: curl-to-bash
    status: retired
  - name: zplug
    method: curl-to-bash
    status: retired
  - name: amix/vimrc
    method: git-clone
    url: https://github.com/amix/vimrc
    status: retired
    superseded_by: "home/dot_config/nvim"
  - name: gpakosz/.tmux
    method: git-clone
    url: https://github.com/gpakosz/.tmux
    status: active
    note: ".bhell also kept a .tmux.conf.local override; not currently managed here"
  - name: mise
    method: curl-to-bash
    url: https://mise.run
    platforms: [darwin, linux]
    status: active
    note: "the one bootstrap that still matters; everything else can come from it"

# Homebrew taps are dropped. Both tap files in .bhell were corrupt - one
# contained the literal string `nnn`, the other `homebrew/cask-fontsnnn` - so
# the tap loop had been silently tapping nothing, or failing, for years.
taps: []
