minimum_pre_commit_version: '4.4.0'
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog staged secrets (offline)
        entry: python3 scripts/check_secrets.py
        language: unsupported
        stages: [pre-commit]
        types: [file]
        require_serial: true
        always_run: true
